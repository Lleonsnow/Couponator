events {
    worker_connections 1024;
}

http {
    map $http_origin $acao {
        default "";
        "~.+" $http_origin;
    }

    map $request_method $block_method {
        default 0;
        GET 0; POST 0; PUT 0; DELETE 0; PATCH 0; OPTIONS 0; HEAD 0;
        PROPFIND 1; PROPPATCH 1; MKCOL 1; COPY 1; MOVE 1; LOCK 1; UNLOCK 1;
        SEARCH 1; REPORT 1; SUBSCRIBE 1; UNSUBSCRIBE 1; NOTIFY 1; TRACE 1; CONNECT 1;
    }

    map $request_uri $suspicious_uri {
        default 0;
        ~*/([a-zA-Z0-9])\1\1\1\1\1\1 1;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }
    upstream backend {
        server backend:3002;
        keepalive 32;
    }

    server {
        listen 80;
        server_name kuponator.pro www.kuponator.pro;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            try_files $uri =404;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name kuponator.pro www.kuponator.pro;

        access_log /var/log/nginx/access.log;

        ssl_certificate /etc/nginx/ssl/live/kuponator.pro/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/kuponator.pro/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        ssl_early_data off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        client_max_body_size 1m;
        client_body_buffer_size 128k;
        client_body_timeout 60s;
        client_header_timeout 60s;

        if ($block_method = 1) { return 405; }
        if ($suspicious_uri = 1) { return 403; }

        location ~ /\.(ht|git|env) {
            deny all;
            return 404;
        }
        location ~* (wp-admin|wp-login|phpmyadmin|adminer|\.env|\.git|\.svn|\.htaccess|\.htpasswd|config\.|\.config|\.old|\.bak|\.sql|\.db|phpinfo|info\.php|test\.php) {
            deny all;
            return 404;
        }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            try_files $uri =404;
            access_log off;
        }

        location /api/documents/file/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
        }

        location /api/documents/pdf/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $acao always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_cors_error;
        }
        location @api_cors_error {
            add_header Access-Control-Allow-Origin $acao always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Type application/json always;
            return 502 '{"error":"Backend unavailable"}';
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;
    }
}
